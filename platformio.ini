[env:m5stack-cplus2-st7735]
platform = espressif32
board = m5stick-c
framework = arduino
extends = env:m5stack-cplus2
build_flags = 
    ${env:m5stack-cplus2.build_flags}
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DTFT_RGB_ORDER=TFT_BGR
lib_deps = 
    ${env:m5stack-cplus2.lib_deps}
    bblanchon/ArduinoJson@^7.4.2
    https://github.com/rennancockles/SimpleCLI
    fbiego/ESP32Time@2.0.6
    bodmer/TFT_eSPI@^2.5.34

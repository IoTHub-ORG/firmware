[env:m5stack-cplus2-st7735]
extends = env:m5stack-cplus2
build_flags = 
    ${env:m5stack-cplus2.build_flags}
    -DUSE_TFT_ESPI=1
    -DTFT_ST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=27000000

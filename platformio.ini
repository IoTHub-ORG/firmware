[env:m5stack-cplus2-st7735]
platform = espressif32
board = m5stick-c
framework = arduino
extends = env:m5stack-cplus2
build_flags = 
    ${env:m5stack-cplus2.build_flags}
    -DUSE_TFT_ESPI=1
    -DTFT_ST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
lib_deps = 
    ${env.lib_deps}
    https://github.com/rennancockles/SimpleCLI
    bblanchon/ArduinoJson@7.4.2
    bodmer/TFT_eSPI@^2.5.34

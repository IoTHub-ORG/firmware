[env:m5stack-cplus2-st7735]
extends = env:m5stack-cplus2
build_flags =
    ${env:m5stack-cplus2.build_flags}
    -UST7789_2_DRIVER
    -UTFT_WIDTH
    -UTFT_HEIGHT
    -UTFT_RGB_ORDER
    -DST7735_DRIVER=1
    -DST7735_GREENTAB160x80=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_RGB_ORDER=0
    -DTFT_INVERSION_ON=1

[env:m5stack-cplus2-st7735]
platform = espressif32
board = m5stick-c
framework = arduino
extends = env:m5stack-cplus2
build_flags = 
    ${env:m5stack-cplus2.build_flags}
    -DUSE_TFT_ESPI=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_ST7735_DRIVER
lib_deps = 
    ${env:m5stack-cplus2.lib_deps}
    bodmer/TFT_eSPI@^2.5.34

[env:adafruit-memento]
board = esp32-s3-devkitc-1
board_build.variant = adafruit-memento
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter = ${env.build_src_filter} +<../boards/adafruit-memento>
build_flags =
	${env.build_flags}
	-Iboards/adafruit-memento

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	; ==================== Feature Gates ====================
	-DHAS_5_BUTTONS
	-DBTN_ALIAS='"OK"'

	; ==================== TFT_eSPI Setup (1.54" 240x240 ST7789) ====================
	-DUSE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON=1
	-DTFT_BACKLIGHT_ON=1
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_MISO=37
	-DTFT_CS=39
	-DTFT_DC=40
	-DTFT_RST=38
	-DTFT_BL=45
	-DTOUCH_CS=-1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== UI & Font Scaling (240x240) ====================
	-DFP=1
	-DFM=2
	-DFG=3
	-DROTATION=0

	; ==================== Expansion Pins (JST-PH A0/A1 & STEMMA QT) ====================
	-DIR_TX_PINS='{ {"JST A0", 17}, {"JST A1", 18}, {"STEMMA SDA", 34}, {"STEMMA SCL", 33} }'
	-DIR_RX_PINS='{ {"JST A1", 18}, {"JST A0", 17}, {"STEMMA SCL", 33}, {"STEMMA SDA", 34} }'
	-DRF_TX_PINS='{ {"JST A0", 17}, {"JST A1", 18}, {"STEMMA SDA", 34}, {"STEMMA SCL", 33} }'
	-DRF_RX_PINS='{ {"JST A1", 18}, {"JST A0", 17}, {"STEMMA SCL", 33}, {"STEMMA SDA", 34} }'

	-DDEVICE_NAME='"Adafruit MEMENTO"'
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
  

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cplus2]
board = esp32
board_build.partitions = custom_8Mb.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.speed = 1500000
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus2>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-cplus2

	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================

	;Features Enabled
	;-DLITE_VERSION=1  ;limits some features to save space for M5Launcher Compatibility
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)

	;Have RTC Chip
	-DHAS_RTC=1

	-DHAS_3_BUTTONS

	; ==================== Library Flags ====================

	;TFT_eSPI Setup (Calibrated 0.96" ST7735S: 161x82, COL:0, ROW:24, BGR, INV:0)
	-DUSE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DCGRAM_OFFSET=1
	-DST7735_GREENTAB160x80=1
	-DTFT_WIDTH=82
	-DTFT_HEIGHT=161
	-DTFT_RGB_ORDER=0
	-DTFT_INVERSION_OFF=1
	-DTFT_BACKLIGHT_ON=1
	-DTFT_CS=5
	-DTFT_DC=14
	-DTFT_RST=12
	-DTOUCH_CS=-1
	-DTFT_MOSI=15
	-DTFT_SCLK=13
	-DTFT_BL=27
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; --- Bruce Small-Screen UI Scaling Flags ---
	-DFP=1
	-DFM=1
	-DFG=2

	; ==================== Environment Flags ====================
	-DARDUINO_M5STICK_C_PLUS2 ; Used in src/core/serial_commands/gpio_commands.cpp


	;Buttons configuration
	-DBTN_ALIAS='"M5"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{ {"Default", 19}, {"M5 IR Mod", 32}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DIR_RX_PINS='{ {"M5 IR Mod", 33}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"M5 RF433T", 32}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DRF_RX_PINS='{ {"M5 RF433R", 33}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'

	-D ANALOG_BAT_PIN=38

	-DROTATION=3


	-DDEVICE_NAME='"M5StickC Plus2"'
	-DM5STICK ; Used in src/core/serial_commands/gpio_commands.cpp
	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=39
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
	
